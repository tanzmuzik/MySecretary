<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>アナログ時計ウィジェット</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="clock-container">
    <svg class="clock" viewBox="0 0 200 200">
      <!-- Clock face background -->
      <circle class="clock-face" cx="100" cy="100" r="95" />

      <!-- Hour markers -->
      <g class="hour-markers">
        <line x1="100" y1="10" x2="100" y2="20" />
        <line x1="100" y1="10" x2="100" y2="20" transform="rotate(30 100 100)" />
        <line x1="100" y1="10" x2="100" y2="20" transform="rotate(60 100 100)" />
        <line x1="100" y1="10" x2="100" y2="20" transform="rotate(90 100 100)" />
        <line x1="100" y1="10" x2="100" y2="20" transform="rotate(120 100 100)" />
        <line x1="100" y1="10" x2="100" y2="20" transform="rotate(150 100 100)" />
        <line x1="100" y1="10" x2="100" y2="20" transform="rotate(180 100 100)" />
        <line x1="100" y1="10" x2="100" y2="20" transform="rotate(210 100 100)" />
        <line x1="100" y1="10" x2="100" y2="20" transform="rotate(240 100 100)" />
        <line x1="100" y1="10" x2="100" y2="20" transform="rotate(270 100 100)" />
        <line x1="100" y1="10" x2="100" y2="20" transform="rotate(300 100 100)" />
        <line x1="100" y1="10" x2="100" y2="20" transform="rotate(330 100 100)" />
      </g>

      <!-- Minute markers -->
      <g class="minute-markers">
        <!-- We'll add smaller markers for each minute if desired -->
      </g>

      <!-- Clock hands -->
      <line class="hand hour-hand" id="hour-hand" x1="100" y1="100" x2="100" y2="50" />
      <line class="hand minute-hand" id="minute-hand" x1="100" y1="100" x2="100" y2="35" />
      <line class="hand second-hand" id="second-hand" x1="100" y1="100" x2="100" y2="30" />

      <!-- Center dot -->
      <circle class="center-dot" cx="100" cy="100" r="4" />
    </svg>

    <!-- Digital time display (optional) -->
    <div class="digital-time" id="digital-time"></div>
  </div>

  <script src="clock.js"></script>
</body>
</html>
