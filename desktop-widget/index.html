<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>デスクトップウィジェット</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="widget-container">
    <!-- Alarm Section -->
    <div class="alarm-section">
      <div class="alarm-header">
        <span class="alarm-title">🔔 アラーム</span>
        <div class="header-buttons">
          <button class="add-alarm-btn" id="add-alarm-btn" title="アラーム追加">+</button>
          <button class="close-btn" id="close-btn" title="閉じる (Esc)">×</button>
        </div>
      </div>
      <div class="alarm-list" id="alarm-list">
        <!-- Alarms will be generated by JavaScript -->
      </div>
    </div>

    <!-- Clock Section -->
    <div class="clock-section">
      <svg class="clock" viewBox="0 0 200 200">
        <!-- Clock circle -->
        <circle cx="100" cy="100" r="90" fill="none" stroke="rgba(255, 255, 255, 0.3)" stroke-width="4"/>

        <!-- Hour markers -->
        <g class="hour-markers">
          <line x1="100" y1="20" x2="100" y2="30" stroke="rgba(255, 255, 255, 0.6)" stroke-width="3"/>
          <line x1="155" y1="45" x2="148" y2="52" stroke="rgba(255, 255, 255, 0.6)" stroke-width="3"/>
          <line x1="180" y1="100" x2="170" y2="100" stroke="rgba(255, 255, 255, 0.6)" stroke-width="3"/>
          <line x1="155" y1="155" x2="148" y2="148" stroke="rgba(255, 255, 255, 0.6)" stroke-width="3"/>
          <line x1="100" y1="180" x2="100" y2="170" stroke="rgba(255, 255, 255, 0.6)" stroke-width="3"/>
          <line x1="45" y1="155" x2="52" y2="148" stroke="rgba(255, 255, 255, 0.6)" stroke-width="3"/>
          <line x1="20" y1="100" x2="30" y2="100" stroke="rgba(255, 255, 255, 0.6)" stroke-width="3"/>
          <line x1="45" y1="45" x2="52" y2="52" stroke="rgba(255, 255, 255, 0.6)" stroke-width="3"/>
        </g>

        <!-- Clock hands -->
        <line id="hour-hand" class="hour-hand" x1="100" y1="100" x2="100" y2="50"/>
        <line id="minute-hand" class="minute-hand" x1="100" y1="100" x2="100" y2="35"/>
        <line id="second-hand" class="second-hand" x1="100" y1="100" x2="100" y2="30"/>

        <!-- Center dot -->
        <circle cx="100" cy="100" r="5" fill="rgba(255, 255, 255, 0.9)"/>
      </svg>

      <div class="digital-time" id="digital-time">00:00:00</div>
    </div>

    <!-- Calendar Section -->
    <div class="calendar-section">
      <div class="calendar-header">
        <button class="nav-btn" id="prev-month">◀</button>
        <span class="calendar-title" id="calendar-title">2024年 1月</span>
        <button class="nav-btn" id="next-month">▶</button>
      </div>
      <div class="calendar-grid">
        <div class="calendar-days-header">
          <div class="day-label">月</div>
          <div class="day-label">火</div>
          <div class="day-label">水</div>
          <div class="day-label">木</div>
          <div class="day-label">金</div>
          <div class="day-label saturday">土</div>
          <div class="day-label sunday">日</div>
        </div>
        <div class="calendar-days" id="calendar-days">
          <!-- Days will be generated by JavaScript -->
        </div>
      </div>
    </div>
  </div>

  <!-- Alarm Modal -->
  <div class="modal" id="alarm-modal" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h3>アラーム設定</h3>
        <button class="modal-close" id="modal-close">×</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>時刻</label>
          <div class="time-input">
            <input type="number" id="alarm-hour" min="0" max="23" value="7" placeholder="時">
            <span>:</span>
            <input type="number" id="alarm-minute" min="0" max="59" value="0" placeholder="分">
          </div>
        </div>
        <div class="form-group">
          <label>ラベル</label>
          <input type="text" id="alarm-label" placeholder="例: 起床" maxlength="20">
        </div>
        <div class="form-group">
          <label>繰り返し</label>
          <div class="repeat-days">
            <button class="day-btn" data-day="1">月</button>
            <button class="day-btn" data-day="2">火</button>
            <button class="day-btn" data-day="3">水</button>
            <button class="day-btn" data-day="4">木</button>
            <button class="day-btn" data-day="5">金</button>
            <button class="day-btn" data-day="6">土</button>
            <button class="day-btn" data-day="0">日</button>
          </div>
        </div>
        <div class="form-group">
          <label>
            <input type="checkbox" id="alarm-enabled" checked>
            有効
          </label>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-cancel" id="cancel-alarm">キャンセル</button>
        <button class="btn-save" id="save-alarm">保存</button>
      </div>
    </div>
  </div>

  <script src="widget.js"></script>
</body>
</html>
