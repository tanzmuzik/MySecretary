<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>天気予報ウィジェット</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="weather-container">
    <!-- Location Selection -->
    <div class="location-header">
      <select class="location-select" id="location-select">
        <option value="Tokyo,JP">東京</option>
        <option value="Osaka,JP">大阪</option>
        <option value="Kyoto,JP">京都</option>
        <option value="Fukuoka,JP">福岡</option>
        <option value="Sapporo,JP">札幌</option>
        <option value="Nagoya,JP">名古屋</option>
        <option value="Yokohama,JP">横浜</option>
        <option value="Kobe,JP">神戸</option>
      </select>
      <button class="refresh-btn" id="refresh-btn" title="更新">🔄</button>
    </div>

    <!-- Current Weather -->
    <div class="current-weather" id="current-weather">
      <div class="weather-icon" id="weather-icon">☀️</div>
      <div class="temperature" id="temperature">--°C</div>
      <div class="weather-description" id="weather-description">読み込み中...</div>
      <div class="weather-details">
        <div class="detail-item">
          <span class="detail-label">体感</span>
          <span class="detail-value" id="feels-like">--°C</span>
        </div>
        <div class="detail-item">
          <span class="detail-label">湿度</span>
          <span class="detail-value" id="humidity">--%</span>
        </div>
        <div class="detail-item">
          <span class="detail-label">風速</span>
          <span class="detail-value" id="wind-speed">-- m/s</span>
        </div>
      </div>
    </div>

    <!-- Forecast -->
    <div class="forecast-section">
      <div class="forecast-title">週間天気</div>
      <div class="forecast-list" id="forecast-list">
        <!-- Forecast items will be generated by JavaScript -->
      </div>
    </div>

    <!-- Last Updated -->
    <div class="last-updated" id="last-updated">最終更新: --</div>

    <!-- Error Message -->
    <div class="error-message" id="error-message" style="display: none;"></div>
  </div>

  <script src="weather.js"></script>
</body>
</html>
